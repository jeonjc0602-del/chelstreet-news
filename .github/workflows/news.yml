name: 뉴스 확인

on:
  schedule:
    # 5분마다 실행 (GitHub 최소 간격. GitHub이 바쁠 때는 조금 늦게 돌 수 있어요)
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: 뉴스 가져오기
        run: node fetch-news.mjs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      - name: 저장하기
        run: |
          git config user.name "chelstreet-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet && exit 0
          git commit -m "뉴스 업데이트"
          git pull --rebase -X theirs origin main || true
          git push
